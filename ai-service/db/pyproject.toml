[project]
name = "personal-productivity-ai-db"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["alembic", "asyncmy", "cryptography", "sqlalchemy[asyncio]"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
