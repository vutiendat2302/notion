# Development override: hot-reload + source bind mounts

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../ai-service:/app
      - ai_venv:/app/.venv

  ocr-service:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../ocr-service:/app
      - ocr_venv:/app/.venv

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_next:
  ai_venv:
  ocr_venv:
