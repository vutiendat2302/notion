name: ${COMPOSE_PROJECT_NAME:-personal-productivity}

services:
  mysql:
    profiles: ["standalone-db"]
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE in .env}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-productivity_db}
      MYSQL_USER: ${MYSQL_USER:-productivity_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:?Set MYSQL_MIGRATION_USER}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Set MYSQL_MIGRATION_PASSWORD}
      AI_MYSQL_DATABASE: ${AI_MYSQL_DATABASE:-ai_metadata_db}
      AI_MYSQL_USER: ${AI_MYSQL_USER:-ai_metadata_app}
      AI_MYSQL_PASSWORD: ${AI_MYSQL_PASSWORD:?Set AI_MYSQL_PASSWORD in .env}
      AI_MYSQL_MIGRATION_USER: ${AI_MYSQL_MIGRATION_USER:?Set AI_MYSQL_MIGRATION_USER}
      AI_MYSQL_MIGRATION_PASSWORD: ${AI_MYSQL_MIGRATION_PASSWORD:?Set AI_MYSQL_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/zz-productivity.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      S2S_SIGNING_SECRET: ${S2S_SIGNING_SECRET:?Set S2S_SIGNING_SECRET in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8001}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET_UPLOADS: ${MINIO_BUCKET_UPLOADS:-personal-uploads}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-personal-exports}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_net
      - shared_mysql_net

  backend-recurrence-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["python", "-m", "app.workers.recurrence_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      S2S_SIGNING_SECRET: ${S2S_SIGNING_SECRET:?Set S2S_SIGNING_SECRET in .env}
    networks:
      - shared_mysql_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - internal_net

  backend-migrate:
    image: ${COMPOSE_PROJECT_NAME:-personal-productivity}-backend:latest
    profiles: ["migration"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL}
    command: ["alembic", "upgrade", "head"]
    networks:
      - shared_mysql_net

  ai-db-migrate:
    build:
      context: ../ai-service/db
      dockerfile: Dockerfile
    profiles: ["migration"]
    environment:
      AI_METADATA_MIGRATION_URL: ${AI_METADATA_MIGRATION_URL:?Set AI_METADATA_MIGRATION_URL}
      AI_METADATA_DATABASE_URL: ${AI_METADATA_DATABASE_URL:?Set AI_METADATA_DATABASE_URL}
    networks:
      - shared_mysql_net

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE in .env}
    profiles: ["storage", "ai", "full"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal_net

  qdrant:
    image: ${QDRANT_IMAGE:?Set QDRANT_IMAGE in .env}
    profiles: ["ai", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - internal_net

  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE in .env}
    profiles: ["ai", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal_net

  ocr-service:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
      target: runtime
    profiles: ["ocr", "ai", "full"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      OCR_PROFILE: ${OCR_PROFILE:-basic}
      OCR_DEFAULT_LANG: ${OCR_DEFAULT_LANG:-vi}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-25000000}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-100}
      OCR_MAX_INPUT_MB: ${OCR_MAX_INPUT_MB:-25}
      OCR_WORKERS: ${OCR_WORKERS:-1}
      OCR_ENABLE_LAYOUT: ${OCR_ENABLE_LAYOUT:-false}
      OCR_ENABLE_TABLE: ${OCR_ENABLE_TABLE:-false}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      S2S_SIGNING_SECRET: ${S2S_SIGNING_SECRET:?Set S2S_SIGNING_SECRET in .env}
    expose:
      - "8866"
    volumes:
      - ocr_models:/home/appuser/.paddleocr
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8866/health/live', timeout=3)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_net

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
      target: runtime
    profiles: ["ai", "full"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-local}
      AI_ALLOW_CLOUD: ${AI_ALLOW_CLOUD:-false}
      AI_LOG_PROMPT_CONTENT: ${AI_LOG_PROMPT_CONTENT:-false}
      AI_MAX_MODEL_REQUESTS: ${AI_MAX_MODEL_REQUESTS:-4}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-8}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      AI_INGEST_MAX_PAGES: ${AI_INGEST_MAX_PAGES:-100}
      AI_INGEST_MAX_FILE_MB: ${AI_INGEST_MAX_FILE_MB:-25}
      AI_JOB_MAX_ATTEMPTS: ${AI_JOB_MAX_ATTEMPTS:-3}
      AI_SERVICE_AUDIENCE: ${AI_SERVICE_AUDIENCE:-ai-service}
      BACKEND_TOOL_AUDIENCE: ${BACKEND_TOOL_AUDIENCE:-backend-tools}
      BACKEND_INTERNAL_BASE_URL: ${BACKEND_INTERNAL_BASE_URL:-http://backend:8000}
      OCR_INTERNAL_URL: ${OCR_INTERNAL_URL:-http://ocr-service:8866}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-personal_knowledge_v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-ai-artifacts}
      AI_METADATA_DATABASE_URL: ${AI_METADATA_DATABASE_URL:-}
      S2S_SIGNING_SECRET: ${S2S_SIGNING_SECRET:?Set S2S_SIGNING_SECRET in .env}
    expose:
      - "8001"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_net
      - shared_mysql_net

networks:
  internal_net:
    driver: bridge
  shared_mysql_net:
    external: true
    name: ${MYSQL_DOCKER_NETWORK:?Set MYSQL_DOCKER_NETWORK}

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
  qdrant_snapshots:
  ollama_data:
  ocr_models:
