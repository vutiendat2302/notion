# Cấu hình hệ thống quản lý và đồng bộ Notion
notion:
  database_id: "36fc917d4c4380338925f756100038d5"
  api_version: "2022-06-28"
  properties:
    title: "Task"
    status: "Status"
    date: "Time"

paths:
  input:
    exported_csv: "input/exported.csv"
    revised_csv: "input/revised.csv"
  output:
    change_plan_csv: "output/change_plan.csv"
    audit_log_csv: "output/audit_log.csv"
    report_json: "output/report.json"
    snapshot_csv: "output/database_snapshot.csv"
    backup_json: "output/backup_raw_pages.json"
    deleted_ids_json: "output/deleted_ids.json"

safety:
  fail_closed: true
  expected_done_count: 602
  protected_status:
    - "Done"
    - "Hoàn thành"
    - "Đã hoàn thành"
    - "Completed"
  deletable_status:
    - "Not started"
    - "Chưa bắt đầu"
    - "To do"
    - "Todo"
